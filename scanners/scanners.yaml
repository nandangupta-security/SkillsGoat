# Registry of scanners SkillsGoat can drive.
#
# Nothing here is installed by default. `python3 goat.py scanners install <id>`
# sets one up inside .scanners/ (gitignored). Scanners are optional: if one is
# missing or broken, Learn, Quiz, export, lint and serve all keep working.
#
# To add a scanner: add an entry here and an adapter in scanners/adapters/.

# LLM providers a scanner's "Static + LLM" mode can use. The user picks ONE for the whole app
# (python3 goat.py llm set <id>, or ./install.sh); each scanner keeps its own key for it.
providers:
  groq:
    name: Groq
    free_plan: true            # free plans cap tokens per minute, so LLM scans are paced
  openai:
    name: OpenAI
  anthropic:
    name: Anthropic

scanners:
  skill-scanner:
    name: Cisco skill-scanner
    adapter: skill_scanner          # scanners/adapters/skill_scanner.py
    homepage: https://github.com/cisco-ai-defense/skill-scanner
    license: Apache-2.0
    install:
      method: pip-venv              # own virtual environment under .scanners/
      package: cisco-ai-skill-scanner
      version: "2.3.2"              # pinned so results are comparable
      python_min: "3.11"            # the scanner's supported range
      python_max: "3.14"
    run:
      executable: skill-scanner     # inside the venv (bin/ or Scripts/)
    llm:
      keys:                                # the variable that holds the key, per provider
        groq: SKILL_SCANNER_LLM_API_KEY
        openai: SKILL_SCANNER_LLM_API_KEY
        anthropic: SKILL_SCANNER_LLM_API_KEY
      free_plan_pause_seconds: 0           # ~5,000 tokens per scan: fits a free plan on its own
    modes:
      static:
        label: Static
        needs_llm: false
      judge:
        label: Static + LLM
        needs_llm: true

  skillspector:
    name: SkillSpector
    adapter: skillspector           # scanners/adapters/skillspector.py
    homepage: https://github.com/NVIDIA/SkillSpector
    license: Apache-2.0
    install:
      method: pip-venv
      package: skillspector
      version: "2.13.7"
      python_min: "3.12"            # 3.14+ needs a native YARA build
      python_max: "3.13"
    run:
      executable: skillspector
    llm:
      keys:
        groq: SKILLSPECTOR_COMPAT_API_KEY
        openai: OPENAI_API_KEY
        anthropic: ANTHROPIC_API_KEY
      free_plan_pause_seconds: 75          # ~10,000+ tokens per scan against ~8,000/minute
    modes:
      static:
        label: Static
        needs_llm: false
      judge:
        label: Static + LLM
        needs_llm: true
