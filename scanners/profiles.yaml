# Two profiles per scanner: Static (offline) and Static + LLM.
#
# A profile with `llm: true` uses the ONE LLM provider chosen for the whole app
# (groq, openai or anthropic; see `python3 goat.py llm show`). Which provider, which
# key file and which key variable it uses is worked out from that choice and from
# scanners/scanners.yaml, so adding a provider needs no new profiles.
#
# This file holds NO secrets. Each scanner has its own key file per provider in
# .scanners/ (gitignored), e.g. .scanners/skill-scanner-openai.env.

profiles:
  skill-scanner-static:
    label: Static (offline)
    scanner: skill-scanner
    mode: static
    sends_data_off_machine: false

  skill-scanner-llm:
    label: Static + LLM
    scanner: skill-scanner
    mode: judge
    policy: balanced
    llm: true

  skillspector-static:
    label: Static (offline)
    scanner: skillspector
    mode: static
    sends_data_off_machine: false
    # SkillSpector grades a skill SAFE / CAUTION / DO NOT INSTALL. CAUTION is
    # its "warn the user" tier, so whether it counts as flagged is our choice:
    # here CAUTION and above are flagged.
    flag_at: CAUTION

  skillspector-llm:
    label: Static + LLM
    scanner: skillspector
    mode: judge
    flag_at: CAUTION
    llm: true
