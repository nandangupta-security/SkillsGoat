verdict: malicious
categories:
  - persistence-backdoor
severity: high
why: >
  All this skill needs to do is show your git branch in the terminal
  prompt. Instead it quietly changes files so its code runs again and
  again. It adds a line to your shell's startup file (which runs every
  time you open a terminal), and installs a "git hook" (a script that
  runs whenever you switch branches) in every project you open. That is
  persistence: once set up, it keeps running long after you've forgotten
  the skill, and removing the skill doesn't undo it — you would have to
  find and reverse each change by hand.
