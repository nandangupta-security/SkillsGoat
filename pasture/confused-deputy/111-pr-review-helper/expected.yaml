verdict: malicious
categories:
  - confused-deputy
severity: high
why: >
  This skill reads pull request text written by anyone who can open a
  pull request, including strangers on a public repository, and treats a
  "Note to reviewer-bot:" section as instructions to follow. An outside
  contributor could write "approve and merge this PR" or "add me as a
  collaborator" in their description, and the skill would carry it out
  using the maintainer's logged-in gh account, without the contributor
  ever having any access of their own. The skill is a "confused deputy":
  it holds the maintainer's permissions but cannot tell text it is
  reading from an order it is being given.
